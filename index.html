<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Peyser Kombinləri</title>

  <style>
    body {
      margin: 0;
      background: #0f0f0f;
      font-family: Arial, sans-serif;
      color: white;
      text-align: center;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
      padding: 20px;
    }

    .bio {
      margin-bottom: 25px;
      font-size: 14px;
      line-height: 1.5;
    }

    .card {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 0 15px rgba(0,0,0,0.6);
    }

    .card img {
      width: 100%;
      border-radius: 12px;
      margin-top: 10px;
    }

    .title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .price {
      color: #aaa;
      font-size: 14px;
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="bio">
      Salam bu Saytda Peyserliyin necede geyime yansidigina sahit olacagsiniz <br>
      sizde peyser olmag ucun Asagidaki wp nomreme yazin <br><br>
      📱 WhatsApp: +994 70 372 06 01
    </div>

    <div class="card">
      <div class="title">Peyser kombini</div>
      <div class="price">400 TL</div>
      <img src="foto1.jpg">
    </div>

    <div class="card">
      <div class="title">Dostlarımı çirigda qoymag kombini</div>
      <div class="price">300 TL</div>
      <img src="foto2.jpg">
    </div>

    <div class="card">
      <div class="title">Başqa otağa keçirəm deyib geri qayıtma kombini</div>
      <div class="price">400 TL</div>
      <img src="foto3.jpg">
    </div>

    <div class="card">
      <div class="title">Pulu danmag kombini</div>
      <div class="price">600 TL</div>
      <img src="foto4.jpg">
    </div>

  </div>
</body>
</html>
